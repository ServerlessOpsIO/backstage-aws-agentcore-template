---
apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: aws-agentcore-agent
  title: Conversational AI Agent (AWS AgentCore, Strands, Bedrock)
  description: |
    Create a conversational AI agent for general or specialized knowledge,
    and for facilitating processes and exercises. This template is not for
    coding agents.

    * Hosted on: Amazon Bedrock AgentCore Runtime
    * Harness: Strands Agents SDK (Python)
    * Model access: Amazon Bedrock

    The agent leads people through a structured session and gives them a
    written document at the end. What a session is about is yours to
    write, as Markdown and one YAML file; the rest comes with the project.

    This template provides the following for the newly created Component

    * A Python agent built with the Strands Agents SDK, using a model on
      Amazon Bedrock
      * A persona, and one example skill to replace with your own
      * A session engine: stages, a session record, hints, facilitator's
        notes and a written document, all driven by the skill
      * Tests, and a command that plays a fixed session against the
        deployed agent
    * An AgentCore Runtime, its IAM execution role and an AgentCore Memory,
      defined with AWS SAM
    * A container image build for the agent (Linux arm64, stored in ECR)
    * GitHub Actions build and deploy workflows
    * Optional Slack front end: a Slack app deployed by a workflow, and a
      service that passes Slack messages to the agent and posts its replies
    * Optional Spec Kit initialization

  tags:
    - aws
    - agentcore
    - strands
    - bedrock
    - ai
    - agent
    - conversational
    - python

spec:
  owner: group:00gjdgxs1ur6lsu
  type: component

  parameters:
    - title: Component Info
      required:
        - lifecycle
        - namespace
        - github_org
        - component_name
        - description
        - owner
        - system
        - domain
        - environment
        - account_id
      properties:
        lifecycle:
          title: Lifecycle
          type: string
          description: Lifecycle for the component
          default: production
          ui:widget: hidden
        namespace:
          title: Namespace
          type: string
          description: Namespace for the component
          default: default
          ui:widget: hidden
        github_org:
          title: GitHub Org
          type: string
          description: GitHub organization to publish to
          default: ServerlessOpsIO
          ui:widget: hidden
        component_name:
          title: Name
          type: string
          description: |
            Unique name of the component. The agent runtime is named
            <name>_<branch>, which must begin with a letter and fit in 48
            characters, so keep the name short.
          ui:field: EntityNamePicker
        description:
          title: Description
          type: string
          description: Short description of the component
        owner:
          title: Owner
          type: string
          description: |
            Owning group of entity.
          ui:field: MyGroupsPicker
          ui:options:
            allowArbitraryValues: false
        domain:
          title: Domain
          type: string
          description: Domain the component belongs to.
          ui:field: SoContextualEntityPicker
          ui:options:
            allowArbitraryValues: false
            catalogFilter:
              - kind: Domain
            defaultKind: Domain
        system:
          title: System
          type: string
          description: System the component belongs to.
          ui:field: SoContextualEntityPicker
          ui:options:
            allowArbitraryValues: false
            catalogFilter:
              - kind: System
                relations.partOf: "{{ parameters.domain }}"
            defaultKind: System
        environment:
          title: Environment
          type: string
          description: Environment the component belongs to.
          ui:field: SoContextualEntityPicker
          ui:options:
            allowArbitraryValues: false
            catalogFilter:
              - kind: Resource
                relations.partOf: "{{ parameters.system }}"
                spec.type: environment
        account_id:
          title: Account ID
          type: string
          description: Cloud account to deploy to
          ui:field: SoContextualEntityPicker
          ui:options:
            allowArbitraryValues: false
            catalogFilter:
              - kind: Resource
                relations.dependencyOf: "{{ parameters.environment }}"
                spec.type: cloud-account

    - title: Agent configuration
      required:
        - agent_name
        - agent_role
        - model_id
        - python_version
        - memory_expiry_days
      properties:
        agent_name:
          title: Agent name
          type: string
          description: |
            What the agent is called in conversation and in the documents it
            produces. It is written to src/agent/persona.md and can be changed
            later.
          minLength: 1
          maxLength: 40
          pattern: '^[^\s#<>`\[\]][^\n#<>`\[\]]*$'
        agent_role:
          title: Agent role
          type: string
          description: |
            Who the agent is, completing the sentence "You are <name>, ...".
            It opens src/agent/persona.md and can be changed later. What the
            agent leads people through is not written here: that is a skill,
            which you write in the new repository. It starts with an example
            skill that leads people through making a decision.
          minLength: 1
          ui:widget: textarea
          default: "a facilitator for engineering teams. You lead people through a structured conversation about their own work, so that they reach their own conclusions and leave with them written down."
        model_id:
          title: Model
          type: string
          description: |
            Amazon Bedrock inference profile the agent uses. These are United
            States profiles; global profiles are refused because the
            organization restricts regions. The deployment account needs
            access to the model. To use a model that is not listed, change
            ModelId in the new repository's cfn-parameters.json.
          default: us.openai.gpt-6-luna
          enum:
            - us.openai.gpt-6.2-sol
            - us.openai.gpt-5.6-sol
            - us.openai.gpt-6.1-terra
            - us.openai.gpt-5.6-terra
            - us.openai.gpt-6-luna
            - us.openai.gpt-5.6-luna
        reasoning_effort:
          title: Reasoning effort
          type: string
          description: |
            How much the model reasons before answering. "default" leaves the
            choice to the model. Reasoning is billed as output.
          default: default
          enum:
            - default
            - none
            - low
            - medium
            - high
            - xhigh
            - max
        python_version:
          title: Python Version
          type: string
          description: Python version to use
          default: '3.14'
          enum:
            - '3.13'
            - '3.14'
        memory_expiry_days:
          title: Memory retention (days)
          type: integer
          description: |
            Days a conversation and its session are kept in AgentCore Memory.
            A session cannot be picked up again after this, and with a Slack
            front end a thread stops being answered this long after its first
            message.
          minimum: 3
          maximum: 365
          default: 30

    - title: Slack
      required:
        - enable_slack_app
      properties:
        enable_slack_app:
          title: "Add a Slack front end?"
          type: boolean
          description: |
            Let people talk to the agent in Slack. This adds a Slack app,
            defined in the repository and kept matching it by a workflow, and
            a service that receives Slack messages, asks the agent and posts
            the reply. People mention the app in a channel and are answered in
            a thread, or send it a direct message. Only full members of the
            workspace are answered. The app can read every message in channels
            it is added to, so that a thread can continue without a mention,
            and can post files, which is how a session's document arrives.

            The app is not created until you follow the first-time setup in
            the project's handbook.
          default: false
      dependencies:
        enable_slack_app:
          oneOf:
            - properties:
                enable_slack_app:
                  const: false
            - required:
                - slack_app_name
                - slack_app_description
                - slack_workspace
                - slack_hostname
              properties:
                enable_slack_app:
                  const: true
                slack_app_name:
                  title: Slack app name
                  type: string
                  description: Name of the app and of its bot user in Slack
                  minLength: 1
                  maxLength: 35
                slack_app_description:
                  title: Slack app description
                  type: string
                  description: Short description shown on the app's profile in Slack
                  minLength: 1
                  maxLength: 140
                slack_workspace:
                  title: Slack workspace
                  type: string
                  description: |
                    The workspace the app is created in, as in
                    <workspace>.slack.com. Only used in the project's
                    documentation.
                  pattern: '^[a-z0-9][a-z0-9-]*$'
                  default: serverlessops
                slack_hostname:
                  title: Hostname
                  type: string
                  description: |
                    FQDN Slack sends events to; ex. my-agent.app.serverlessops.io.
                    It must be in the deployment account's hosted zone.
                  pattern: '^[a-z0-9]([a-z0-9-]*[a-z0-9])?(\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)+$'

    - title: Spec Kit
      required:
        - initialize_speckit
      properties:
        initialize_speckit:
          title: "Initialize Spec Kit?"
          type: boolean
          description: Initialize Spec Kit in the generated project workspace
          default: true
      dependencies:
        initialize_speckit:
          oneOf:
            - properties:
                initialize_speckit:
                  const: false
            - required:
                - speckit_integration
              properties:
                initialize_speckit:
                  const: true
                speckit_integration:
                  title: Coding agent
                  type: string
                  description: AI coding agent Spec Kit is set up for
                  default: claude
                  enum:
                    - claude
                    - copilot
                    - codex

    - title: Copilot Cloud Agent
      required: []
      properties:
        launch_copilot_agent:
          title: "Launch Copilot agent?"
          type: boolean
          description: Launch a Copilot cloud agent after component creation
          default: false
      dependencies:
        launch_copilot_agent:
          oneOf:
            - properties:
                launch_copilot_agent:
                  const: false
            - required:
                - github_auth
                - agent_prompt
              properties:
                launch_copilot_agent:
                  const: true
                agent_prompt:
                  title: Agent prompt
                  type: string
                  description: |
                    Initial prompt to send to the Copilot cloud agent. When
                    Spec Kit is initialized for Copilot, this is instead the
                    description of the project and its principles used to
                    write the Spec Kit constitution, which arrives as a pull
                    request.
                  minLength: 1
                  ui:widget: textarea
                github_auth:
                  type: string
                  ui:field: SoRequestUserCredentials
                  ui:options:
                    host: github.com
                    requestUserCredentials:
                      secretsKey: USER_GITHUB_TOKEN
                      additionalScopes:
                        github:
                          - read:user

  steps:
    - id: fetch
      name: Fetch Entity References
      action: catalog:fetch
      input:
        entityRefs:
          - ${{ parameters.owner }}
          - ${{ parameters.domain }}
          - ${{ parameters.system }}
          - ${{ parameters.account_id }}

    - id: create-skeleton
      name: Create project skeleton
      action: fetch:template
      input:
        url: ./skeleton
        values:
          domain_name: ${{ parameters.domain | parseEntityRef | pick('name') }}
          system_name: ${{ parameters.system | parseEntityRef | pick('name') }}
          component_name: ${{ parameters.component_name }}
          owner_name: ${{ parameters.owner | parseEntityRef | pick('name') }}
          description: ${{ parameters.description }}
          github_org: ${{ parameters.github_org }}
          lifecycle: ${{ parameters.lifecycle }}
          agent_name: ${{ parameters.agent_name }}
          agent_role: ${{ parameters.agent_role }}
          model_id: ${{ parameters.model_id }}
          reasoning_effort: ${{ parameters.reasoning_effort }}
          python_version: ${{ parameters.python_version }}
          memory_expiry_days: ${{ parameters.memory_expiry_days }}
          initialize_speckit: ${{ parameters.initialize_speckit }}
          enable_slack_app: ${{ parameters.enable_slack_app }}
          slack_app_name: ${{ parameters.slack_app_name }}
          slack_hostname: ${{ parameters.slack_hostname }}

    - id: create-pipeline
      name: Create CI/CD pipeline
      action: fetch:template
      input:
        url: ./pipeline
        values:
          python_version: ${{ parameters.python_version }}
          enable_slack_app: ${{ parameters.enable_slack_app }}

    # Adds the Slack app (definition, program, workflow), the service that
    # connects it to the agent (Lambda functions, shared code, OpenAPI
    # definition), their tests and their handbook pages. It also replaces the
    # skeleton's Pipfile.lock with one that has the development packages these
    # need.
    - id: create-slack-app
      if: ${{ parameters.enable_slack_app }}
      name: Add Slack front end
      action: fetch:template
      input:
        url: ./slack-app
        replace: true
        copyWithoutTemplating:
          - Pipfile.lock
          - scripts/**
          - slack/manifest.schema.json
          - data/**
          - src/handlers/**
          - src/common/common/**
          - tests/unit/common/**
          - tests/unit/handlers/**
        values:
          component_name: ${{ parameters.component_name }}
          github_org: ${{ parameters.github_org }}
          python_version: ${{ parameters.python_version }}
          memory_expiry_days: ${{ parameters.memory_expiry_days }}
          slack_app_name: ${{ parameters.slack_app_name }}
          slack_app_description: ${{ parameters.slack_app_description }}
          slack_workspace: ${{ parameters.slack_workspace }}
          slack_hostname: ${{ parameters.slack_hostname }}

    - id: initialize-speckit
      if: ${{ parameters.initialize_speckit }}
      name: Initialize Spec Kit
      action: github:speckit:init
      input:
        integration: ${{ parameters.speckit_integration }}

    - id: publish
      name: Publish to GitHub
      action: publish:github
      input:
        repoUrl: github.com?repo=${{ parameters.component_name }}&owner=${{ parameters.github_org }}
        repoVisibility: public
        protectDefaultBranch: false
        requiredApprovingReviewCount: 0
        description: ${{ parameters.description }}
        gitAuthorName: ${{ user.entity.spec.profile.displayName }}
        gitAuthorEmail:  ${{ user.entity.spec.profile.email }}
        gitCommitMessage: "Initial commit via Backstage"
        defaultBranch: main
        secrets:
          DEPLOYMENT_ACCOUNT_ID: ${{ steps.fetch.output.entities[3].metadata.title }}
        customProperties:
          system: ${{ parameters.system | parseEntityRef | pick('name') }}
          domain: ${{ parameters.domain | parseEntityRef | pick('name') }}
          owner: ${{ parameters.owner | parseEntityRef | pick('name') }}

    - id: register
      name: Register in Backstage
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps.publish.output.repoContentsUrl }}
        catalogInfoPath: "/catalog-info.yaml"

    # The Spec Kit agent actions launch Copilot tasks, so the constitution is
    # only created when Spec Kit was initialized for Copilot. Otherwise the
    # prompt is sent to a plain Copilot cloud agent task.
    - id: launch-copilot-agent
      name: Launch Copilot agent
      if: ${{ parameters.launch_copilot_agent and not (parameters.initialize_speckit and parameters.speckit_integration === 'copilot') }}
      action: github:copilot:agent:launch
      input:
        repoUrl: github.com?repo=${{ parameters.component_name }}&owner=${{ parameters.github_org }}
        prompt: ${{ parameters.agent_prompt }}
        userCredentialsSecretKey: USER_GITHUB_TOKEN
      secrets:
        USER_GITHUB_TOKEN: ${{ secrets.USER_GITHUB_TOKEN }}

    - id: create-speckit-constitution
      name: Create Spec Kit constitution
      if: ${{ parameters.launch_copilot_agent and parameters.initialize_speckit and parameters.speckit_integration === 'copilot' }}
      action: github:speckit:constitution
      input:
        repoUrl: github.com?repo=${{ parameters.component_name }}&owner=${{ parameters.github_org }}
        prompt: ${{ parameters.agent_prompt }}
        createPullRequest: true
        userCredentialsSecretKey: USER_GITHUB_TOKEN
      secrets:
        USER_GITHUB_TOKEN: ${{ secrets.USER_GITHUB_TOKEN }}

  output:
    links:
      - title: New repository
        url: ${{ steps.publish.output.remoteUrl }}
      - title: Repository catalog-info.yaml file
        url: ${{ steps.publish.output.remoteUrl }}/blob/main/catalog-info.yaml
      - title: Open in catalog
        icon: catalog
        entityRef: ${{ steps.register.output.entityRef }}
      - title: Slack first-time setup
        url: ${{ steps.publish.output.remoteUrl + '/blob/main/docs/handbook/08-slack-app.md#first-time-setup' if parameters.enable_slack_app else nil }}
      - title: Launched agent task
        url: ${{ steps['launch-copilot-agent'].output.taskUrl if parameters.launch_copilot_agent and not (parameters.initialize_speckit and parameters.speckit_integration === 'copilot') else nil }}
      - title: Spec Kit constitution task
        url: ${{ steps['create-speckit-constitution'].output.taskUrl if parameters.launch_copilot_agent and parameters.initialize_speckit and parameters.speckit_integration === 'copilot' else nil }}
